# =======================
# Hassan Kohla — Site Configuration
# =======================

locale                   : "en-US"
site_theme               : "default"
title                    : "Hassan Kohla"
title_separator          : "-"
name                     : &name "Hassan Kohla"
description              : &description "Teaching Assistant in Mechatronics & Robotics Engineering | Egyptian Russian University (ERU)"
url                      : "https://hassankohla.github.io"
baseurl                  : ""
repository               : "hassankohla/hassankohla.github.io"

# =======================
# Author Information (Sidebar)
# =======================
author:
  avatar           : "profile.png"
  name             : "Hassan Kohla"
  pronouns         : "Eng."
  bio              : "Teaching Assistant @ERU | Mechatronics & Robotics | PV Cooling & Control Researcher"
  location         : "Cairo, Egypt"
  employer         : "Egyptian Russian University (ERU)"
  uri              : ""
  email            : "hassan-said@eru.edu.eg"

  # Academic sites
  googlescholar    : "https://scholar.google.com/citations?user=YOUR_ID"
  researchgate     : "https://www.researchgate.net/profile/Hassan-Kohla"
  orcid            : "https://orcid.org/YOUR-ID"
  scopus           : ""
  academia         : ""
  pubmed           : ""
  semantic         : ""

  # Repositories / software
  github           : "hassankohla"
  kaggle           : ""
  stackoverflow    : ""
  bitbucket        : ""
  codepen          : ""
  dribbble         : ""

  # Social media
  linkedin         : "https://www.linkedin.com/in/hassankohla"
  facebook         : ""
  instagram        : ""
  twitter          : ""
  youtube          : ""
  medium           : ""
  telegram         : ""
  mastodon         : ""
  pinterest        : ""
  tiktok           : ""
  bluesky          : ""
  weibo            : ""
  wikipedia        : ""
  xing             : ""

# =======================
# Publication Categories
# =======================
publication_category:
  books:
    title: "Books"
  manuscripts:
    title: "Journal Articles"
  conferences:
    title: "Conference Papers"

# =======================
# Site Settings
# =======================
teaser                   : "profile.png"
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false

comments:
  provider               : false

atom_feed:
  hide                   : false
  path                   :

# =======================
# SEO
# =======================
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :

# =======================
# Social Sharing
# =======================
twitter:
  username               : ""
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 : "/images/profile.png"
og_description           : "Official academic and research portfolio of Hassan Kohla — Teaching Assistant in Mechatronics & Robotics at ERU."

social:
  type                   : "Person"
  name                   : "Hassan Kohla"
  links:
    - "https://github.com/hassankohla"
    - "https://www.linkedin.com/in/hassankohla"
    - "https://www.researchgate.net/profile/Hassan-Kohla"

# =======================
# Analytics
# =======================
analytics:
  provider               : "false"
  google:
    tracking_id          :

# =======================
# File Settings
# =======================
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Gemfile
  - LICENSE
  - node_modules
  - package.json*
  - README
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# =======================
# Conversion
# =======================
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# =======================
# Collections
# =======================
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

# =======================
# Defaults
# =======================
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: true
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true

# =======================
# Sass
# =======================
sass:
  sass_dir: _sass
  style: compressed

# =======================
# Output & Permalink
# =======================
permalink: /:categories/:title/
timezone: Africa/Cairo

# =======================
# Plugins
# =======================
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# =======================
# Archives
# =======================
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# =======================
# HTML Compression
# =======================
compress_html:
  clippings: all
  ignore:
    envs: development
